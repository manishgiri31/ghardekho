name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ghcr.io/manishgiri31/ghardekho-api:${{ github.sha }} \
            -t ghcr.io/manishgiri31/ghardekho-api:latest \
            .

      - name: Build Web image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ghardekho.tech \
            -f apps/web/Dockerfile \
            -t ghcr.io/manishgiri31/ghardekho-web:${{ github.sha }} \
            -t ghcr.io/manishgiri31/ghardekho-web:latest \
            .

      - name: Push API image
        run: |
          docker push ghcr.io/manishgiri31/ghardekho-api:${{ github.sha }}
          docker push ghcr.io/manishgiri31/ghardekho-api:latest

      - name: Push Web image
        run: |
          docker push ghcr.io/manishgiri31/ghardekho-web:${{ github.sha }}
          docker push ghcr.io/manishgiri31/ghardekho-web:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ghardekho

            docker compose pull api web

            docker compose run --rm api \
              node packages/database/node_modules/prisma/build/index.js \
              migrate deploy \
              --schema packages/database/prisma/schema.prisma

            docker compose up -d api web

            docker image prune -f