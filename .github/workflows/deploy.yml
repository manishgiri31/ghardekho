name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify pinned Prisma versions
        shell: bash
        run: |
          node -e "const r = require('module').createRequire(process.cwd() + '/packages/database/package.json'); for (const name of ['prisma', '@prisma/client']) { const version = require(r.resolve(name + '/package.json')).version; if (version !== '6.12.0') throw new Error(name + ' resolved to ' + version); console.log(name + ' ' + version); }"

      - name: Build API
        run: npm run build:api

      - name: Build API Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ghcr.io/manishgiri31/ghardekho-api:${{ github.sha }} \
            -t ghcr.io/manishgiri31/ghardekho-api:latest \
            .

      - name: Build Web Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ghardekho.tech \
            -f apps/web/Dockerfile \
            -t ghcr.io/manishgiri31/ghardekho-web:${{ github.sha }} \
            -t ghcr.io/manishgiri31/ghardekho-web:latest \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        run: |
          docker push ghcr.io/manishgiri31/ghardekho-api:${{ github.sha }}
          docker push ghcr.io/manishgiri31/ghardekho-api:latest

      - name: Push Web image
        run: |
          docker push ghcr.io/manishgiri31/ghardekho-web:${{ github.sha }}
          docker push ghcr.io/manishgiri31/ghardekho-web:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ghardekho

            docker compose pull api web

            docker compose run --rm api \
              node packages/database/prisma/run-prisma.mjs \
              migrate deploy \
              --schema prisma/schema.prisma

            docker compose up -d api web

            docker image prune -f
